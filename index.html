<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Painel de Comissionamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div id="shell"></div>
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h2>Dashboard Executivo<small>Visão geral de comissionamento</small></h2>
      </div>
      <div>
        <a href="/parceiros.html" class="btn btn-primary">+ Novo Parceiro</a>
      </div>
    </div>

    <!-- Alertas -->
    <div id="alertasBox"></div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpis"></div>

    <!-- Gráficos -->
    <div class="grid-2 mb-24">
      <div class="chart-wrap">
        <div class="section-title">Comissão por Mês <small>últimos 12 meses</small></div>
        <canvas id="chartMes"></canvas>
      </div>
      <div class="chart-wrap">
        <div class="section-title">Volume vs Comissão Paga</div>
        <canvas id="chartDonut"></canvas>
      </div>
    </div>

    <!-- Ranking -->
    <div class="card">
      <div class="section-title">Ranking de Parceiros <small>por comissão gerada</small></div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Parceiro</th>
              <th>Clientes</th>
              <th>Operações</th>
              <th class="text-right">Comissão Total</th>
              <th class="text-right">Paga</th>
              <th class="text-right">Pendente</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
async function loadDashboard() {
  try {
    const data = await api('/dashboard');
    renderKpis(data.kpis);
    renderAlertas(data.kpis, data.config);
    renderChartMes(data.por_mes);
    renderChartDonut(data.kpis);
    renderRanking(data.ranking);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function renderAlertas(k, cfg) {
  if (!k.alerta_amarelo && !k.alerta_vermelho) {
    document.getElementById('alertasBox').innerHTML = '';
    return;
  }
  const html = `
    <div class="card mb-24" style="border-left:4px solid ${k.alerta_vermelho ? '#ef4444' : '#f59e0b'}">
      <div class="flex flex-between">
        <div>
          <strong style="font-size:15px">⚠ Comissões aguardando pagamento</strong>
          <p class="text-muted" style="margin:6px 0 0;font-size:13px">
            ${k.alerta_amarelo} pendente(s) há mais de ${cfg.dias_amarelo} dias ·
            <strong style="color:#ef4444">${k.alerta_vermelho} atrasada(s) há mais de ${cfg.dias_vermelho} dias</strong> ·
            Total: <strong>${fmtBRL(k.valor_atrasado)}</strong>
          </p>
        </div>
        <a href="/operacoes.html?status=pendente" class="btn btn-primary">Ver operações</a>
      </div>
    </div>
  `;
  document.getElementById('alertasBox').innerHTML = html;
}

function renderKpis(k) {
  const cards = [
    { icon: '👥', color: 'blue', label: 'Parceiros Ativos', value: k.parceiros_ativos, sub: `${k.total_parceiros} no total` },
    { icon: '🏢', color: 'purple', label: 'Clientes Cadastrados', value: k.total_clientes, sub: `${k.clientes_ativos} ativos` },
    { icon: '⚡', color: 'blue', label: 'Operações', value: k.total_operacoes, sub: 'realizadas' },
    { icon: '↓', color: 'green', label: 'Volume Financeiro', value: fmtBRLShort(k.volume_financeiro), valueClass: 'green' },
    { icon: '↓', color: 'green', label: 'Comissão Total', value: fmtBRLShort(k.comissao_total), valueClass: '' },
    { icon: '✓', color: 'green', label: 'Comissão Paga', value: fmtBRLShort(k.comissao_paga), valueClass: 'green', sub: k.comissao_total > 0 ? `${((k.comissao_paga / k.comissao_total) * 100).toFixed(1)}% do total` : '' },
    { icon: '⏱', color: 'orange', label: 'Comissão Pendente', value: fmtBRLShort(k.comissao_pendente), valueClass: 'orange', sub: k.comissao_total > 0 ? `${((k.comissao_pendente / k.comissao_total) * 100).toFixed(1)}% do total` : '' }
  ];
  document.getElementById('kpis').innerHTML = cards.map(c => `
    <div class="kpi">
      <div class="kpi-icon ${c.color}">${c.icon}</div>
      <div>
        <div class="kpi-label">${c.label}</div>
        <div class="kpi-value ${c.valueClass || ''}">${c.value}</div>
        ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ''}
      </div>
    </div>
  `).join('');
}

let chartMesInst, chartDonutInst;

function renderChartMes(rows) {
  const ctx = document.getElementById('chartMes');
  const labels = rows.map(r => {
    const [y, m] = r.mes.split('-');
    return `${m}/${y.slice(2)}`;
  });
  const data = rows.map(r => r.comissao);
  if (chartMesInst) chartMesInst.destroy();
  chartMesInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Comissão',
        data,
        backgroundColor: 'rgba(37, 99, 235, 0.85)',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: v => 'R$ ' + (v / 1000).toFixed(0) + 'k' }
        }
      }
    }
  });
}

function renderChartDonut(k) {
  const ctx = document.getElementById('chartDonut');
  if (chartDonutInst) chartDonutInst.destroy();
  chartDonutInst = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Comissão Paga', 'Comissão Pendente'],
      datasets: [{
        data: [k.comissao_paga, k.comissao_pendente],
        backgroundColor: ['#10b981', '#f59e0b'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: {
          callbacks: { label: ctx => `${ctx.label}: ${fmtBRL(ctx.raw)}` }
        }
      }
    }
  });
}

function renderRanking(rows) {
  const tbody = document.getElementById('rankingBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="icon">★</div><h3>Nenhum parceiro cadastrado</h3><p>Comece cadastrando seu primeiro parceiro.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td><strong>${i + 1}º</strong></td>
      <td><strong>${r.nome}</strong>${r.empresa ? `<br><small class="text-muted">${r.empresa}</small>` : ''}</td>
      <td>${r.total_clientes}</td>
      <td>${r.total_operacoes}</td>
      <td class="text-right"><strong>${fmtBRL(r.comissao_total)}</strong></td>
      <td class="text-right text-success">${fmtBRL(r.comissao_paga)}</td>
      <td class="text-right text-warning">${fmtBRL(r.comissao_pendente)}</td>
      <td class="text-right">
        <a href="/relatorio.html?id=${r.id}" class="btn btn-sm">Relatório</a>
      </td>
    </tr>
  `).join('');
}

bootPage('dashboard', loadDashboard);
</script>
</body>
</html>
